name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: wdpilot
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bin: wdpilot.exe
          - os: macos-15
            target: aarch64-apple-darwin
            bin: wdpilot
          - os: macos-15
            target: x86_64-apple-darwin
            bin: wdpilot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libx11-dev libxdo-dev \
            xvfb openbox xterm xdotool

      - name: Unit tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Self-test (MCP protocol, no screen)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --self-test

      - name: E2E on Linux (Xvfb + openbox + xterm)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          sleep 1
          openbox &
          sleep 1
          xterm -geometry 100x30+100+100 -T "e2e-term" &
          sleep 2
          python3 tests/e2e_linux.py ./target/${{ matrix.target }}/release/wdpilot

      - name: Windows smoke (list windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./target/${{ matrix.target }}/release/wdpilot.exe --list-windows || echo "no interactive desktop on runner"

      - uses: actions/upload-artifact@v4
        with:
          name: wdpilot-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
